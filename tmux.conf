unbind r
bind r source-file ~/.tmux.conf

set-option -sa terminal-overrides ",xterm*:Tc"

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# bind ctrl b to ctrl s
set -g prefix C-s 

set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top
# need tpm at this point
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Refresh rapide
set -g status-interval 5

# Gauche : serveur + session
set -g status-left "#[fg=green]#H|#[fg=cyan]#S "

# Fenêtres simples et lisibles
set -g window-status-format "#I:#W"
set -g window-status-current-format "#[bold]#I:#W"

# Droite : chemin + date
set -g status-right "#[fg=orange]#{pane_current_path} #[fg=white]| %H:%M"

##### Styles sobres #####
set -g status-style "bg=black,fg=white"
set -g window-status-style "fg=white"
set -g window-status-current-style "fg=green"

##### Nom des fenêtres automatique #####
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"


# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

run '~/.tmux/plugins/tpm/tpm'
